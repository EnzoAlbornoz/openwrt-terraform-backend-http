# Builds the OpenWrt package on every published GitHub release, then:
# - attaches the .ipk and .apk files to the release;
# - publishes signed package repositories on GitHub Pages:
#     <pages>/opkg/  for OpenWrt 24.10 and older (opkg)
#     <pages>/apk/   for OpenWrt 25.12 and newer (apk)
#     <pages>/keys/  the public keys to verify them
#
# Running it manually builds the packages without publishing anything.
#
# Setup (once): see openwrt/README.md.

name: Release

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    handler:
        name: Build handler
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: jdx/mise-action@v4

            - run: aube ci

            - name: Check
              working-directory: packages/handler
              run: |
                  aube run fmt:check
                  aube run lint
                  aube run test

            - name: Build
              working-directory: packages/handler
              run: aube run build

            - uses: actions/upload-artifact@v7
              with:
                  name: handler
                  path: packages/handler/dist/index.uc
                  if-no-files-found: error

    package:
        name: Package (${{ matrix.format }})
        needs: handler
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    # The package is architecture independent (PKGARCH:=all),
                    # so one SDK per package manager builds it for every router.
                    - format: opkg
                      sdk: x86_64-openwrt-24.10
                    - format: apk
                      sdk: x86_64-openwrt-25.12
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8
              with:
                  name: handler
                  path: openwrt/feed/terraform-backend-http/files

            - name: Prepare package
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  mv openwrt/feed/terraform-backend-http/files/index.uc \
                      openwrt/feed/terraform-backend-http/files/handler.uc

                  # Manual runs keep the version of the Makefile.
                  [ -n "$TAG" ] || exit 0

                  version="${TAG#v}"
                  # apk only accepts plain versions here (no -rc1 etc).
                  if ! echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
                      echo "::error::Release tag '$TAG' is not a version like v1.2.3"
                      exit 1
                  fi

                  sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$version/" \
                      openwrt/feed/terraform-backend-http/Makefile

            - name: Check signing key
              env:
                  KEY: ${{ matrix.format == 'opkg' && secrets.USIGN_PRIVATE_KEY || secrets.APK_PRIVATE_KEY }}
              run: |
                  if [ -z "$KEY" ]; then
                      echo "::error::Missing the ${{ matrix.format }} signing key secret, see openwrt/README.md"
                      exit 1
                  fi

            - uses: openwrt/gh-action-sdk@v11
              env:
                  ARCH: ${{ matrix.sdk }}
                  FEED_DIR: ${{ github.workspace }}/openwrt/feed
                  FEEDNAME: terraform
                  PACKAGES: terraform-backend-http
                  INDEX: 1
                  KEY_BUILD: ${{ matrix.format == 'opkg' && secrets.USIGN_PRIVATE_KEY || '' }}
                  PRIVATE_KEY: ${{ matrix.format == 'apk' && secrets.APK_PRIVATE_KEY || '' }}

            - uses: actions/upload-artifact@v7
              with:
                  name: repo-${{ matrix.format }}
                  path: bin/packages/x86_64/terraform/
                  if-no-files-found: error

    publish:
        name: Publish
        if: github.event_name == 'release'
        needs: package
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8
              with:
                  name: repo-opkg
                  path: site/opkg

            - uses: actions/download-artifact@v8
              with:
                  name: repo-apk
                  path: site/apk

            - name: Add public keys
              run: |
                  for key in usign.pub apk.pem; do
                      if [ ! -f "openwrt/keys/$key" ]; then
                          echo "::error::Missing openwrt/keys/$key, see openwrt/README.md"
                          exit 1
                      fi
                  done

                  mkdir -p site/keys
                  cp openwrt/keys/usign.pub openwrt/keys/apk.pem site/keys/

            - name: Attach packages to the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$TAG" site/opkg/*.ipk site/apk/*.apk --clobber

            - uses: actions/configure-pages@v6

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site

            - id: deploy
              uses: actions/deploy-pages@v5
